<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 7 Spanish · Listening Practice</title>
<style>
  :root{
    --bg:#fff8f0; --card:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b; --line:#e9ddc9;
    --accent:#c9622e; --accent-soft:#f7e6d8; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:680px;margin:0 auto;padding:32px 18px 60px}
  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent)}
  p.sub{margin:0 0 24px;color:var(--muted)}

  h2{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
    margin:26px 0 10px;font-weight:700}

  a.quiz{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin:8px 0;box-shadow:0 2px 8px rgba(150,110,70,.07);
    transition:transform .1s, box-shadow .1s}
  a.quiz:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(150,110,70,.14)}
  a.quiz .unit{color:var(--accent);font-weight:800;flex:none;font-variant-numeric:tabular-nums}
  a.quiz .title{font-weight:700}
  a.quiz .es{color:var(--muted);font-weight:400}

  footer{margin-top:36px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Spanish Listening Practice</h1>
  <p class="sub">Year 7 · 2026 — click a title, listen, and check your answers for instant feedback.</p>

  <h2>Unit 1</h2>
  <a class="quiz" href="02_De_donde_eres_quiz.html">
    <span class="unit">1.1</span>
    <span><span class="title">¿De dónde eres?</span> <span class="es">— Where are you from?</span></span>
  </a>
  <a class="quiz" href="01_Que_tal_quiz.html">
    <span class="unit">1.2</span>
    <span><span class="title">¿Qué tal?</span> <span class="es">— How are you?</span></span>
  </a>
  <a class="quiz" href="03_Mi_cumpleanos_quiz.html">
    <span class="unit">1.4</span>
    <span><span class="title">Mi cumpleaños</span> <span class="es">— My birthday</span></span>
  </a>
  <a class="quiz" href="04_Mi_color_favorito_quiz.html">
    <span class="unit">1.5</span>
    <span><span class="title">Mi color favorito</span> <span class="es">— My favourite colour</span></span>
  </a>

  <footer>More activities coming soon.</footer>
</div>
</body>
</html>
